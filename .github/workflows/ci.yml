name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required directories
        run: |
          test -d week-01-linux
          test -d week-02-git
          test -d development
          test -d docker
          test -d ci-cd
          test -d cloud
          test -d testing
          test -d final-project

      - name: Check README
        run: |
          test -f README.md
          grep -q "DevOps Learning Journey" README.md

      - name: CI success message
        run: echo "All repository checks passed successfully."
